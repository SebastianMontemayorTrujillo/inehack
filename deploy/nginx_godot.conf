# Ejemplo para un servidor estático detrás de un proxy HTTPS.
# Adaptar server_name y root; validar con nginx -t antes de recargar.
server {
    listen 80;
    server_name juego.example.org;
    root /var/www/voces-de-la-plaza;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
}
